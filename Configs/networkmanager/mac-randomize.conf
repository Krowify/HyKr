# Randomize the WiFi MAC address on every connection attempt (not just
# scanning, which NetworkManager already randomizes by default) --
# prevents any network you join from tracking this laptop across visits
# by its hardware MAC. "random" means a brand-new address every single
# connection, even to the same network twice in a row -- if a network's
# captive portal or access control whitelists by MAC, expect to look
# like a new device each time.
[connection]
wifi.cloned-mac-address=random
