# Seed only -- theme-switcher/apply-theme.sh regenerates this file from the
# ACTIVE theme's templates/hyprlock.conf.tpl on every theme switch, and
# link_dots.sh applies the default (minimal) theme during install. This copy is
# what you get before any theme has ever been applied, so it is rendered from
# the minimal theme to match.
#
# It used to be a hand-written file pinned to `monitor = DP-5` / `DP-4` -- the
# author's desktop outputs. On any other machine that meant hyprlock came up
# with no background and no input field at all: a black screen you had to type
# your password into blind. Every per-theme template uses a bare `monitor =`
# (all outputs); so does this now.

background {
    monitor =
    # path = 
    color = rgba(20,20,20,1.0)
    blur_passes = 2
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

general {
    no_fade_in = false
    grace = 0
    disable_loading = true
}

input-field {
    monitor =
    size = 250, 60
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = true

    outer_color = rgb(255,255,255)
    inner_color = rgb(28,28,28)
    font_color = rgb(255,255,255)

    fade_on_empty = true
    placeholder_text = <span foreground="#ffffff">Password...</span>
    hide_input = false
    position = 0, -120
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    color = rgb(255,255,255)
    font_size = 120
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, 80
    halign = center
    valign = center
}

label {
    monitor =
    text = hi, $USER
    color = rgb(122,162,247)
    font_size = 25
    font_family = JetBrainsMono Nerd Font
    position = 0, -40
    halign = center
    valign = center
}
