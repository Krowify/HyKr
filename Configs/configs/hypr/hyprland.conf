# Monitor: single default, adjust per-machine
monitor = , preferred, auto, auto

# Pywal colors for window borders (generated from Configs/configs/wal/templates/colors-hyprland)
source = $HOME/.cache/wal/colors-hyprland

general {
    col.active_border = $color4
    col.inactive_border = $backgroundCol
}

# Autostart
exec-once = waybar
exec-once = swaync
exec-once = hypridle
exec-once = awww-daemon
exec-once = wal -R
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
exec-once = mkdir -p ~/Pictures/Screenshots

$mainMod = SUPER
$terminal = kitty
$fileManager = dolphin
$menu = wofi --show drun -n
$editor = kate
$browser = brave

# Dropdown terminal on its own special workspace
exec-once = [workspace special:dropterm silent] $terminal --class dropterm
windowrulev2 = float, class:^(dropterm)$
windowrulev2 = size 80% 60%, class:^(dropterm)$

# --------------------------------------------------- // Terminal
bind = $mainMod, RETURN, exec, $terminal
bind = $mainMod ALT, T, togglespecialworkspace, dropterm

# --------------------------------------------------- // Close, force-kill, exit
bind = $mainMod, Q, killactive,
bind = $mainMod ALT, F4, exec, kill -9 $(hyprctl activewindow -j | jq -r .pid)
bind = $mainMod, DELETE, exit,
bind = $mainMod, ESCAPE, exec, wlogout
bind = $mainMod, L, exec, hyprlock

# --------------------------------------------------- // Toggle
bind = $mainMod, T, togglefloating,
bind = $mainMod, G, togglegroup,
bind = $mainMod, J, togglesplit,
bind = $mainMod, M, exec, pkill -f 'quickshell -c hykr' || quickshell -c hykr
bind = $mainMod CTRL, B, exec, pkill waybar || waybar
bind = $mainMod, N, exec, swaync-client -t -sw
bind = $mainMod SHIFT, N, exec, pkill hyprsunset || hyprsunset
bind = $mainMod SHIFT, I, exec, pkill hypridle || hypridle
bind = $mainMod, S, exec, ~/.config/hypr/quick_settings.sh

# --------------------------------------------------- // Launchers and apps
bind = $mainMod, TAB, exec, $menu
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, C, exec, $editor
bind = $mainMod, B, exec, $browser
bind = $mainMod, V, exec, cliphist list | wofi --dmenu | cliphist decode | wl-copy

# --------------------------------------------------- // Workspace and theming
bind = $mainMod CTRL, right, workspace, r+1
bind = $mainMod CTRL, left, workspace, r-1
bind = $mainMod CTRL, down, workspace, empty
bind = $mainMod SHIFT, W, exec, ~/.config/hypr/wallpaper.sh
bind = $mainMod SHIFT, T, exec, ~/.config/theme-switcher/theme-picker.sh

# --------------------------------------------------- // Alt
bind = ALT, P, pseudo,
bind = ALT, TAB, cyclenext,
bind = ALT SHIFT, TAB, cyclenext, prev

# --------------------------------------------------- // Window movement
bind = $mainMod CTRL, H, changegroupactive, b
bind = $mainMod CTRL, L, changegroupactive, f
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d
bind = $mainMod SHIFT, left, resizeactive, -30 0
bind = $mainMod SHIFT, right, resizeactive, 30 0
bind = $mainMod SHIFT, up, resizeactive, 0 -30
bind = $mainMod SHIFT, down, resizeactive, 0 30
bind = $mainMod CTRL SHIFT, left, movewindow, l
bind = $mainMod CTRL SHIFT, right, movewindow, r
bind = $mainMod CTRL SHIFT, up, movewindow, u
bind = $mainMod CTRL SHIFT, down, movewindow, d
bind = $mainMod SHIFT, comma, movewindow, mon:-1
bind = $mainMod SHIFT, period, movewindow, mon:+1

# Hold-to-move / hold-to-resize (arrows; Escape to exit)
bind = $mainMod, Z, submap, move
submap = move
binde = , right, moveactive, 30 0
binde = , left, moveactive, -30 0
binde = , up, moveactive, 0 -30
binde = , down, moveactive, 0 30
bind = , escape, submap, reset
submap = reset

bind = $mainMod, X, submap, resize
submap = resize
binde = , right, resizeactive, 30 0
binde = , left, resizeactive, -30 0
binde = , up, resizeactive, 0 -30
binde = , down, resizeactive, 0 30
bind = , escape, submap, reset
submap = reset

bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

bind = $mainMod ALT, 1, movetoworkspacesilent, 1
bind = $mainMod ALT, 2, movetoworkspacesilent, 2
bind = $mainMod ALT, 3, movetoworkspacesilent, 3
bind = $mainMod ALT, 4, movetoworkspacesilent, 4
bind = $mainMod ALT, 5, movetoworkspacesilent, 5
bind = $mainMod ALT, 6, movetoworkspacesilent, 6
bind = $mainMod ALT, 7, movetoworkspacesilent, 7
bind = $mainMod ALT, 8, movetoworkspacesilent, 8
bind = $mainMod ALT, 9, movetoworkspacesilent, 9
bind = $mainMod ALT, 0, movetoworkspacesilent, 10

# --------------------------------------------------- // Screenshot
bind = , Print, exec, grim - | wl-copy
bind = $mainMod, P, exec, grim -g "$(slurp)" - | wl-copy
bind = $mainMod ALT, P, exec, grim -o "$(hyprctl monitors -j | jq -r '.[] | select(.focused==true) | .name')" - | wl-copy
bind = $mainMod SHIFT, P, exec, grim -g "$(slurp)" ~/Pictures/Screenshots/$(date +'%Y-%m-%d_%H-%M-%S').png

# --------------------------------------------------- // Other (hardware, media, no modifier)
bind = SHIFT, F11, fullscreen, 0
bindl = , F10, exec, pamixer -t
bindle = , F11, exec, pamixer -d 5
bindle = , F12, exec, pamixer -i 5

# --------------------------------------------------- // Mouse
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
