# Adapted from elifouts/Dotfiles: dropped the `hyprdvd -s` listener (not a
# recognized tool, likely personal/broken) and the hardcoded
# /opt/spotify/spotify inhibit path (doesn't match spotify-launcher, the
# package this repo actually installs).
source = $HOME/.cache/wal/colors-hyprland

general {
    # lock.sh rather than hyprlock: it already refuses to stack a second
    # instance (the job the `pidof hyprlock ||` guard used to do here), and
    # once you unlock it brings back the bar the active theme wants -- a
    # Quickshell dock does not always survive hyprlock's session-lock
    # surface. This is also the path `loginctl lock-session` takes, so the
    # keybind, wlogout and the idle timeout all behave identically.
    lock_cmd = $HOME/.config/hypr/lock.sh
    # Laptop lid close triggers systemd-logind's suspend directly -- nothing
    # here binds the lid switch itself. before_sleep_cmd is hypridle's own
    # hook for "about to suspend, for any reason", lid included, so the
    # screen locks before the lid closes rather than sitting unlocked
    # between a lid-close suspend and the next wake.
    before_sleep_cmd = loginctl lock-session
}

listener {
    timeout = 800
    on-timeout = source $HOME/.cache/wal/colors.sh && notify-send "System" "You are about to be locked out!" -i $wallpaper
}
listener {
    timeout = 1000
    on-timeout = loginctl lock-session
    on-resume = sleep 2 && source $HOME/.cache/wal/colors.sh && notify-send "System" "Unlocked! Hey $USER" -i $wallpaper
}
listener {
    timeout = 2400
    # Hyprland's `hyprctl dispatch` now evals its argument as Lua
    # (`hl.dispatch(...)`) rather than accepting the classic
    # `dispatch dpms off` shorthand -- see hyprland.lua for why.
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({action = "off"})'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
}
listener {
    # The backstop that stops a closed lid costing a battery.
    #
    # Up to here hypridle only notifies, locks and blanks -- DPMS off at 2400
    # makes the screen dark, which looks exactly like sleep while the machine
    # keeps running. And logind's lid switch, the only other thing in this repo
    # that ever suspends, is deliberately set to ignore the lid whenever an
    # external display is connected (setup_suspend.sh's Docked=ignore, so the
    # laptop can drive a monitor lid-shut). Between the two, a laptop at a desk
    # with the lid closed and the charger out ran flat overnight.
    #
    # 3600 so it lands well after the screen has already been off for 20
    # minutes -- this should never be the thing that interrupts you.
    #
    # idle_sleep.sh is a no-op on a desktop and on the charger, and picks
    # suspend-then-hibernate over plain suspend wherever hibernation works, so
    # the bound holds even on s2idle-only firmware. Media players and backups
    # holding an inhibitor are respected; hypridle honours those too.
    timeout = 3600
    on-timeout = $HOME/.config/hypr/idle_sleep.sh
}
