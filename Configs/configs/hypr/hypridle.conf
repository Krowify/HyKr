# Adapted from elifouts/Dotfiles: dropped the `hyprdvd -s` listener (not a
# recognized tool, likely personal/broken) and the hardcoded
# /opt/spotify/spotify inhibit path (doesn't match spotify-launcher, the
# package this repo actually installs).
source = $HOME/.cache/wal/colors-hyprland

general {
    lock_cmd = pidof hyprlock || hyprlock
    # Laptop lid close triggers systemd-logind's suspend directly -- nothing
    # here binds the lid switch itself. before_sleep_cmd is hypridle's own
    # hook for "about to suspend, for any reason", lid included, so the
    # screen locks before the lid closes rather than sitting unlocked
    # between a lid-close suspend and the next wake.
    before_sleep_cmd = loginctl lock-session
}

listener {
    timeout = 800
    on-timeout = source $HOME/.cache/wal/colors.sh && notify-send "System" "You are about to be locked out!" -i $wallpaper
}
listener {
    timeout = 1000
    on-timeout = loginctl lock-session
    on-resume = sleep 2 && source $HOME/.cache/wal/colors.sh && notify-send "System" "Unlocked! Hey $USER" -i $wallpaper
}
listener {
    timeout = 2400
    # Hyprland's `hyprctl dispatch` now evals its argument as Lua
    # (`hl.dispatch(...)`) rather than accepting the classic
    # `dispatch dpms off` shorthand -- see hyprland.lua for why.
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({action = "off"})'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
}
