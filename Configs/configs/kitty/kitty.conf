# current-theme.conf is regenerated by whichever ran most recently:
# hypr/wallpaper.sh (from the actual wallpaper's pywal colors) or
# theme-switcher/apply-theme.sh (from the applied theme's colors.json)
include current-theme.conf

# Needed for apply_wallpaper.sh to live-recolor every open kitty window
# on wallpaper switch (kitty only reads its config once at startup and
# never watches the file, so without this, only windows opened *after*
# a switch pick up the new theme). socket-only (not "yes") so only
# local processes can drive it, not anything with escape-sequence
# access remotely. allow_remote_control alone does NOT auto-allocate a
# socket or export KITTY_LISTEN_ON -- listen_on has to be set
# explicitly, templated per-PID so multiple open windows each get
# their own socket instead of colliding on one path.
allow_remote_control socket-only
listen_on unix:/tmp/kitty-{kitty_pid}

font_family           family='Hurmit Nerd Font' postscript_name=HurmitNF-Regular
bold_font             auto
italic_font           auto
bold_italic_font      auto
window_padding_width  5
tab_bar_style         slant
enable_audio_bell     no
notify_on_cmd_finish  unfocused
