# current-theme.conf is regenerated by whichever ran most recently:
# hypr/wallpaper.sh (from the actual wallpaper's pywal colors) or
# theme-switcher/apply-theme.sh (from the applied theme's colors.json)
include current-theme.conf

font_family           family='Hurmit Nerd Font' postscript_name=HurmitNF-Regular
bold_font             auto
italic_font           auto
bold_italic_font      auto
window_padding_width  5
tab_bar_style         slant
enable_audio_bell     no
notify_on_cmd_finish  unfocused
